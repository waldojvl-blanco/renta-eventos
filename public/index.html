<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Renta de muebles · Dashboard de eventos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">Renta de <span class="rosa">muebles</span></div>
      <div class="sub">Dashboard de eventos — Colima</div>
    </div>
    <button class="btn-primary" id="newBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Nueva nota
    </button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="filters" id="filters">
      <button data-f="prox" class="on">Próximos</button>
      <button data-f="todos">Todos</button>
      <button data-f="pasados">Pasados</button>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="search" placeholder="Buscar cliente, lugar o producto…">
    </div>
  </div>

  <div id="board"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Nueva nota</h3>
      <button class="x" id="closeModal">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot" style="display:none"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <span class="x" id="lbClose">&times;</span>
  <img id="lbImg" alt="Nota original">
</div>

<div class="toast" id="toast"></div>

<!-- OCR gratis (corre en el navegador, no gasta servidor ni tokens) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- Para leer PDFs (renderiza la primera página y le pasa el OCR) -->
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs" type="module"></script>
<script>
  // exponer pdfjs para app.js
  window.__pdfjsReady = (async () => {
    try {
      const pdfjs = await import('https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.4.168/build/pdf.worker.min.mjs';
      window.pdfjsLib = pdfjs;
      return true;
    } catch (e) { return false; }
  })();
</script>
<script src="app.js"></script>
</body>
</html>
